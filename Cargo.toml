[package]
name = "jev-pilot"
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
description = "Drive a mobile UI with TypeSafe Jev as the System One decision provider: code enumerates the valid actions, the model only selects one."
repository = "https://github.com/OliverRhyme/jev-pilot"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["android", "ios", "ui-automation", "testing", "agent"]
categories = ["development-tools::testing", "api-bindings"]
exclude = ["/.cargo", "/t", "/.python-reference"]
# Personal project. `cargo publish` refuses outright while this is set.
publish = false

[dependencies]
# The operating system's entropy source on every platform: /dev/urandom does not
# exist on Windows.
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = { version = "0.20", optional = true }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.4", optional = true, default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = { version = "1", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "macros", "io-std", "signal"] }
# Every browser endpoint is ws://127.0.0.1, so no TLS and no async runtime.
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
# Ctrl-C in a fresh run closes the browser and removes its profile, from a
# thread of its own while the run is blocked.
ctrlc = { version = "3.5", optional = true }
# The extension bridge's local socket or named pipe, and what the OS says about
# the program at its other end.
interprocess = { version = "2.4.8", optional = true }
sha2 = { version = "0.11.1", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", optional = true, default-features = false, features = ["socket", "poll", "user"] }
rustix = { version = "1.1.6", optional = true, default-features = false, features = ["std", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", optional = true }
core-foundation = { version = "0.10.1", optional = true }
jev-pilot-os = { path = "jev-pilot-os", optional = true }

[target.'cfg(windows)'.dependencies]
jev-pilot-os = { path = "jev-pilot-os", optional = true }
# The named pipe's security descriptor, from SDDL, as interprocess takes it.
widestring = { version = "1.2.1", optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

[features]
default = ["android", "ios", "http"]
# UIAutomator hierarchy parsing and the Android system gestures.
android = ["dep:roxmltree"]
# XCUITest hierarchy parsing and the iOS system gestures.
ios = ["dep:roxmltree"]
# A blocking HTTP transport. Without it the crate builds the request and you
# send it with whatever client you already have.
http = ["dep:ureq"]
# An MCP server, so another agent can drive a device and answer its impasses.
#
# Off by default, and deliberately. It brings an async runtime with it, and the
# loop itself has no use for one: a step is observe, judge, act, settle, and
# each waits on the one before. Everything using this crate as a library would
# pay for a runtime that only the server needs.
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]
# Driving a web browser over the Chrome DevTools Protocol, spoken by this crate
# over one local websocket. Off by default like `mcp`: a library user who only
# drives phones pays nothing for it.
browser = ["dep:tungstenite", "dep:ctrlc"]
# Driving the owner's own Chrome through a jev-pilot extension, over a local
# socket or named pipe whose other end each side identifies through the OS.
extension = [
    "browser",
    "dep:interprocess",
    "dep:sha2",
    "dep:nix",
    "dep:rustix",
    "dep:security-framework",
    "dep:core-foundation",
    "dep:jev-pilot-os",
    "dep:widestring",
]

# docs.rs renders every feature, and marks which items need which.
# The server is a binary of its own, and only exists when its feature is on.
[[bin]]
name = "jev-pilot"
path = "src/main.rs"

[workspace]
members = [".", "jev-pilot-os"]

# Released as prebuilt binaries even though it is never published to
# crates.io; without this, `publish = false` hides it from `dist`.
[package.metadata.dist]
dist = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
# The documentation names products and platform APIs in prose — TypeSafe,
# UIAutomator, XCUITest, VoiceOver. Backticking them would imply they are items
# in this crate rather than things in the world.
doc_markdown = "allow"

# The profile that 'dist' will build with.
#
# Built for size, since a release is something people download. Whole-program
# LTO in one codegen unit, optimising for size: on Apple silicon the two
# programs went from 3.9MB each to 2.6MB and 2.1MB, and the archive from 1.83MB
# to 1.39MB. The loop waits on the device and the network, not the CPU, so the
# speed given up is not felt. Panics still unwind: the server runs each tool
# call as its own task, and aborting would take the whole server down with one.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
